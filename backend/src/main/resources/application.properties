# App
spring.application.name=smart-campus-api
# Allow running from IDE/mvn directly by auto-loading local env-style properties.
spring.config.import=optional:file:.env.local[.properties],optional:file:.env[.properties]
# Use a stable default port for frontend integration.
# Override with env var SERVER_PORT or CLI arg --server.port=8083 if needed.
server.port=8081

# Database (H2 file-based: persists between restarts)
# AUTO_SERVER helps when multiple JVMs/tools try to open the same DB file.
spring.datasource.url=jdbc:h2:file:./data/smartcampus;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MongoDB
spring.data.mongodb.uri=mongodb+srv://pafproject:paf%4012345@cluster0.tywbgdc.mongodb.net/pafDB

app.seed.enabled=true


# JWT
app.jwt.secret=c21hcnRjYW1wdXMtc3VwZXItc2VjdXJlLWp3dC1zZWNyZXQta2V5LWZvci1vYXV0aDItbG9naW4tMjAyNi1wcm9qZWN0LWF1dGhlbnRpY2F0aW9uLXN5c3RlbQ==
app.jwt.expiration-ms=86400000

# Frontend
app.frontend.url=http://localhost:5173

# Google OAuth2
# Keep non-empty defaults so app can boot even if env vars are missing.
# Replace with real values via GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET in .env.local.
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:__MISSING_GOOGLE_CLIENT_SECRET__}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:__MISSING_GOOGLE_CLIENT_ID__}
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Logging
logging.level.org.springframework=INFO
logging.level.com.smartcampus=DEBUG


