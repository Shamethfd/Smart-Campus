# App
spring.application.name=smart-campus-api
# Use a stable default port for frontend integration.
# Override with env var SERVER_PORT or CLI arg --server.port=8083 if needed.
server.port=${SERVER_PORT:8082}

# Database (H2 file-based: persists between restarts)
# AUTO_SERVER helps when multiple JVMs/tools try to open the same DB file.
spring.datasource.url=jdbc:h2:file:./data/smartcampus;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.org.springframework=INFO
logging.level.com.smartcampus=DEBUG